name: Feature
description: A piece of work that adds or changes behaviour
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements that define when this is done.
      value: |
        - [ ] 
        - [ ] Tests cover the new behaviour
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Hints, links, files to look at, things that are out of scope.
